name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Also to run CI on a branch whose pull request was opened by a workflow (GITHUB_TOKEN events start no runs).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request or branch cancels the run that is still busy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Runs prepack (embedded spec, TypeScript declarations) and lists what would be published.
      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate

  # The one check the branch rules require, whatever the jobs above: it fails when any of them did not succeed.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
