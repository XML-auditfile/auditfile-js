name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Fetch auditfile-spec (spec.lock.json)
        shell: pwsh
        run: ./tools/fetch-spec.ps1

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Runs prepack (embedded spec, TypeScript declarations) and lists what would be published.
      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
